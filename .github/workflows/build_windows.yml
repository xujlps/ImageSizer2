name: Build Windows Portable EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pyinstaller

      - name: Build portable EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ImageSizer --collect-all tkinterdnd2 --hidden-import=tkinterdnd2 ImageSizer.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\ImageSizer.exe")) {
            throw "ImageSizer.exe was not generated."
          }
          Get-Item "dist\ImageSizer.exe" | Format-List Name,Length,FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v6
        with:
          name: ImageSizer-Windows-Portable
          path: dist/ImageSizer.exe
          if-no-files-found: error
          retention-days: 30
